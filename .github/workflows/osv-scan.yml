# Runs OSV-Scanner across every manifest/lockfile in the repo and uploads the
# findings as SARIF to the GitHub Security tab. Read-only: it parses manifests,
# it does NOT install any of the (vulnerable) packages.
#
# Uses the official reusable workflow. Bump the @vX.Y.Z tag as new releases land.
name: osv-scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  scan:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.0"
    with:
      scan-args: |-
        --recursive
        ./
