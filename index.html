<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YOLO</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; }
    #app { position: fixed; inset: 0; }
    .hint {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #6b7280; letter-spacing: .14em; text-transform: uppercase;
      pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hint">move your mouse &middot; yolo</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

    const app = document.getElementById('app');

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.06);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    app.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0x404060, 1.2));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(4, 6, 8);
    scene.add(key);
    const rim = new THREE.PointLight(0x5b8cff, 60, 60);
    rim.position.set(-6, -2, 4);
    scene.add(rim);
    const warm = new THREE.PointLight(0xff5bb0, 50, 60);
    warm.position.set(6, 3, -2);
    scene.add(warm);

    // Starfield for depth
    (() => {
      const g = new THREE.BufferGeometry();
      const n = 600, pos = new Float32Array(n * 3);
      for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 60;
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x3a3a5c, size: 0.06 })));
    })();

    const group = new THREE.Group();
    scene.add(group);

    const material = new THREE.MeshStandardMaterial({
      color: 0xf4f4ff, metalness: 0.9, roughness: 0.18,
      emissive: 0x1b2550, emissiveIntensity: 0.5,
    });

    const FONT_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json';
    new FontLoader().load(FONT_URL, (font) => {
      const geo = new TextGeometry('YOLO', {
        font, size: 2.4, height: 0.6, curveSegments: 12,
        bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.06, bevelSegments: 4,
      });
      geo.center();
      group.add(new THREE.Mesh(geo, material));
    });

    // Mouse-driven hover target
    const target = { x: 0, y: 0 };
    addEventListener('pointermove', (e) => {
      target.x = (e.clientX / innerWidth) * 2 - 1;
      target.y = (e.clientY / innerHeight) * 2 - 1;
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    (function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Hover: gentle vertical bob + mouse parallax tilt
      group.position.y = Math.sin(t * 1.3) * 0.25;
      group.rotation.x += ((-target.y * 0.5) - group.rotation.x) * 0.05;
      group.rotation.y += ((target.x * 0.8) - group.rotation.y) * 0.05;

      rim.position.x = Math.sin(t * 0.7) * 6;
      warm.position.y = Math.cos(t * 0.6) * 4;

      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
